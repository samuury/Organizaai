services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-organizaai}
      POSTGRES_USER: ${POSTGRES_USER:-organizaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organizaai_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-organizaai} -d ${POSTGRES_DB:-organizaai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: